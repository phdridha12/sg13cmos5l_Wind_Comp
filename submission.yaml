short-description: Hand-drawn analog-on-top macro built from the inverter sub-macro.

# Please add the documentation about your project here.
# Why did you choose to create it? How does it work? How can it be tested, etc.?
# If your project requires additional external hardware, e.g. a USB port,
# please mention this so it can be considered when designing the PCB.
long-description: |
  An analog-on-top example macro for the ihp-sg13cmos5l Open-PDK.

  The top level is drawn **by hand** in KLayout on top of the `tiny` floorplan
  template and instantiates four `inverter` unit cells from the `inverter`
  sub-macro in `macros/inverter/`.

  The macro is signed off with the full analog flow:

  * Xschem schematic and transient testbench, simulated with ngspice
  * KLayout and Magic DRC
  * KLayout and Magic + Netgen LVS
  * Magic parasitic extraction, followed by a post-layout simulation
  * CACE characterization of the inverter unit cell

  Testing: drive `uio_in[0]` and observe the inverter outputs on `analog_1`
  and `analog_2`; `analog_0` is the analog input. `VPWR`/`VGND` supply the
  digital rails and `VAPWR` the analog rail. Reproduce the committed results
  with `make all` inside the IIC-OSIC-TOOLS container. No additional external
  hardware is required.

